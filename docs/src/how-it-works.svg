<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830">
  <style>
    text { font-family: 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace; }
    .title { fill: #ffffff; font-size: 24px; font-weight: 700; }
    .subtitle { fill: #94a3b8; font-size: 13px; }
    .name { fill: #ffffff; font-size: 15px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 12px; }
    .tiny { fill: #94a3b8; font-size: 11px; }
    .lane { font-size: 12px; font-weight: 700; letter-spacing: 1px; }
    .foot { fill: #64748b; font-size: 12px; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="a-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="a-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker>
    <marker id="a-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/></marker>
    <marker id="a-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/></marker>
    <marker id="a-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/></marker>
  </defs>

  <rect width="1200" height="830" fill="#0f172a"/>
  <rect width="1200" height="830" fill="url(#grid)"/>

  <!-- title -->
  <text x="40" y="48" class="title">hermes-field-notes</text>
  <text x="40" y="74" class="subtitle">pitfalls you only debug once · core patches checked after every hermes update</text>

  <!-- lanes -->
  <rect x="30" y="100" width="1140" height="190" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="46" y="124" class="lane" fill="#22d3ee">NOTES · PITFALLS AND OBSERVATIONS</text>
  <rect x="30" y="310" width="1140" height="310" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="46" y="334" class="lane" fill="#fbbf24">PATCHES · LOCAL EDITS OF THE HERMES CORE</text>
  <rect x="30" y="640" width="1140" height="140" rx="12" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="46" y="664" class="lane" fill="#60a5fa">WATCH · OPTIONAL, HOURLY</text>

  <!-- ===== lane A arrows ===== -->
  <line x1="275" y1="192" x2="343" y2="192" stroke="#22d3ee" stroke-width="1.4" marker-end="url(#a-cyan)"/>
  <line x1="565" y1="192" x2="633" y2="192" stroke="#22d3ee" stroke-width="1.4" marker-end="url(#a-cyan)"/>
  <text x="600" y="182" class="tiny" text-anchor="middle">0 hits</text>
  <line x1="855" y1="192" x2="923" y2="192" stroke="#22d3ee" stroke-width="1.4" marker-end="url(#a-cyan)"/>
  <path d="M 1035 234 L 1035 266 L 455 266 L 455 237" fill="none" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#a-cyan)"/>
  <text x="745" y="258" class="tiny" text-anchor="middle">next time it is found, not debugged again</text>

  <!-- ===== lane A boxes ===== -->
  <rect x="55" y="150" width="220" height="84" rx="6" fill="#0f172a"/>
  <rect x="55" y="150" width="220" height="84" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="165" y="178" class="name" text-anchor="middle">problem appears</text>
  <text x="165" y="200" class="sub" text-anchor="middle">gateway error, silent</text>
  <text x="165" y="218" class="sub" text-anchor="middle">cron, broke on update</text>

  <rect x="345" y="150" width="220" height="84" rx="6" fill="#0f172a"/>
  <rect x="345" y="150" width="220" height="84" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="455" y="178" class="name" text-anchor="middle">search first</text>
  <text x="455" y="200" class="sub" text-anchor="middle">your notes +</text>
  <text x="455" y="218" class="sub" text-anchor="middle">known-pitfalls.md</text>

  <rect x="635" y="150" width="220" height="84" rx="6" fill="#0f172a"/>
  <rect x="635" y="150" width="220" height="84" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="745" y="178" class="name" text-anchor="middle">debug</text>
  <text x="745" y="200" class="sub" text-anchor="middle">the cause is rarely</text>
  <text x="745" y="218" class="sub" text-anchor="middle">what the symptom says</text>

  <rect x="925" y="150" width="220" height="84" rx="6" fill="#0f172a"/>
  <rect x="925" y="150" width="220" height="84" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="1035" y="178" class="name" text-anchor="middle">record a note</text>
  <text x="1035" y="200" class="sub" text-anchor="middle">fieldnotes.py new</text>
  <text x="1035" y="218" class="sub" text-anchor="middle">INDEX.md generated</text>

  <!-- ===== lane B arrows ===== -->
  <line x1="275" y1="402" x2="343" y2="402" stroke="#fbbf24" stroke-width="1.4" marker-end="url(#a-amber)"/>
  <line x1="565" y1="402" x2="633" y2="402" stroke="#fbbf24" stroke-width="1.4" marker-end="url(#a-amber)"/>
  <line x1="855" y1="402" x2="923" y2="402" stroke="#fbbf24" stroke-width="1.4" marker-end="url(#a-amber)"/>
  <!-- bus from doctor to the four statuses -->
  <path d="M 1035 444 L 1035 462 L 165 462" fill="none" stroke="#fbbf24" stroke-width="1.4"/>
  <line x1="165" y1="462" x2="165" y2="481" stroke="#fbbf24" stroke-width="1.4" marker-end="url(#a-amber)"/>
  <line x1="455" y1="462" x2="455" y2="481" stroke="#fbbf24" stroke-width="1.4" marker-end="url(#a-amber)"/>
  <line x1="745" y1="462" x2="745" y2="481" stroke="#fbbf24" stroke-width="1.4" marker-end="url(#a-amber)"/>
  <line x1="1035" y1="462" x2="1035" y2="481" stroke="#fbbf24" stroke-width="1.4" marker-end="url(#a-amber)"/>
  <!-- re-apply loop back to doctor -->
  <path d="M 455 567 L 455 598 L 1158 598 L 1158 402 L 1147 402" fill="none" stroke="#fb7185" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#a-rose)"/>
  <text x="745" y="590" class="tiny" text-anchor="middle">after re-applying: restart, run doctor again</text>

  <!-- ===== lane B boxes ===== -->
  <rect x="55" y="360" width="220" height="84" rx="6" fill="#0f172a"/>
  <rect x="55" y="360" width="220" height="84" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="165" y="388" class="name" text-anchor="middle">edit the core</text>
  <text x="165" y="410" class="sub" text-anchor="middle">a fix or a tweak inside</text>
  <text x="165" y="428" class="sub" text-anchor="middle">hermes-agent</text>

  <rect x="345" y="360" width="220" height="84" rx="6" fill="#0f172a"/>
  <rect x="345" y="360" width="220" height="84" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="455" y="388" class="name" text-anchor="middle">patch note</text>
  <text x="455" y="410" class="sub" text-anchor="middle">marker in the code +</text>
  <text x="455" y="428" class="sub" text-anchor="middle">&lt;id&gt;.checks.json</text>

  <rect x="635" y="360" width="220" height="84" rx="6" fill="#0f172a"/>
  <rect x="635" y="360" width="220" height="84" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="745" y="388" class="name" text-anchor="middle">hermes update</text>
  <text x="745" y="410" class="sub" text-anchor="middle">replaces the core,</text>
  <text x="745" y="428" class="sub" text-anchor="middle">local edits included</text>

  <rect x="925" y="360" width="220" height="84" rx="6" fill="#0f172a"/>
  <rect x="925" y="360" width="220" height="84" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="1035" y="388" class="name" text-anchor="middle">doctor</text>
  <text x="1035" y="410" class="sub" text-anchor="middle">read-only check of</text>
  <text x="1035" y="428" class="sub" text-anchor="middle">the core on disk</text>

  <!-- statuses -->
  <rect x="55" y="483" width="220" height="84" rx="6" fill="#0f172a"/>
  <rect x="55" y="483" width="220" height="84" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="165" y="511" class="name" text-anchor="middle" fill="#34d399" style="fill:#34d399">OK</text>
  <text x="165" y="533" class="sub" text-anchor="middle">all signs in place</text>
  <text x="165" y="551" class="sub" text-anchor="middle">nothing to do</text>

  <rect x="345" y="483" width="220" height="84" rx="6" fill="#0f172a"/>
  <rect x="345" y="483" width="220" height="84" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="455" y="511" class="name" text-anchor="middle" style="fill:#fb7185">MISSING</text>
  <text x="455" y="533" class="sub" text-anchor="middle">the update wiped it:</text>
  <text x="455" y="551" class="sub" text-anchor="middle">re-apply, owner's yes</text>

  <rect x="635" y="483" width="220" height="84" rx="6" fill="#0f172a"/>
  <rect x="635" y="483" width="220" height="84" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="745" y="511" class="name" text-anchor="middle" style="fill:#a78bfa">UPSTREAMED</text>
  <text x="745" y="533" class="sub" text-anchor="middle">the core fixed it:</text>
  <text x="745" y="551" class="sub" text-anchor="middle">retire the patch</text>

  <rect x="925" y="483" width="220" height="84" rx="6" fill="#0f172a"/>
  <rect x="925" y="483" width="220" height="84" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="1035" y="511" class="name" text-anchor="middle" style="fill:#fbbf24">UNKNOWN</text>
  <text x="1035" y="533" class="sub" text-anchor="middle">could not decide:</text>
  <text x="1035" y="551" class="sub" text-anchor="middle">read the reason</text>

  <!-- ===== lane C arrows ===== -->
  <line x1="275" y1="723" x2="343" y2="723" stroke="#60a5fa" stroke-width="1.4" marker-end="url(#a-blue)"/>
  <line x1="565" y1="723" x2="633" y2="723" stroke="#60a5fa" stroke-width="1.4" marker-end="url(#a-blue)"/>
  <line x1="855" y1="723" x2="923" y2="723" stroke="#60a5fa" stroke-width="1.4" marker-end="url(#a-blue)"/>
  <text x="890" y="713" class="tiny" text-anchor="middle">on change</text>

  <!-- ===== lane C boxes ===== -->
  <rect x="55" y="684" width="220" height="78" rx="6" fill="#0f172a"/>
  <rect x="55" y="684" width="220" height="78" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="165" y="712" class="name" text-anchor="middle">hourly cron job</text>
  <text x="165" y="734" class="sub" text-anchor="middle">no_agent: no model,</text>
  <text x="165" y="751" class="sub" text-anchor="middle">no tokens</text>

  <rect x="345" y="684" width="220" height="78" rx="6" fill="#0f172a"/>
  <rect x="345" y="684" width="220" height="78" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="455" y="712" class="name" text-anchor="middle">fieldnotes tick</text>
  <text x="455" y="734" class="sub" text-anchor="middle">doctor checks +</text>
  <text x="455" y="751" class="sub" text-anchor="middle">core vs latest release</text>

  <rect x="635" y="684" width="220" height="78" rx="6" fill="#0f172a"/>
  <rect x="635" y="684" width="220" height="78" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="745" y="712" class="name" text-anchor="middle">pinned dashboard</text>
  <text x="745" y="734" class="sub" text-anchor="middle">one Telegram message,</text>
  <text x="745" y="751" class="sub" text-anchor="middle">edited in place</text>

  <rect x="925" y="684" width="220" height="78" rx="6" fill="#0f172a"/>
  <rect x="925" y="684" width="220" height="78" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="1035" y="712" class="name" text-anchor="middle">one-line alert</text>
  <text x="1035" y="734" class="sub" text-anchor="middle">only when a status</text>
  <text x="1035" y="751" class="sub" text-anchor="middle">changes</text>

  <!-- footer -->
  <text x="40" y="810" class="foot">the skill never edits the core and never runs patch scripts: it records, verifies and reminds</text>
</svg>
